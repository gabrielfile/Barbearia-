import React, { useState, useMemo } from "react";
import { createRoot } from "react-dom/client";
import {

// ============================================================================
// Tokens de design
// ============================================================================

const FUNDO = "#150F19";
const PAINEL = "#1B1420";
const PAINEL_CLARO = "#241A2B";
const CARTAO = "#211823";
const OURO = "#C9A227";
const VERDE = "#8FB8A8";
const AMBAR = "#E0A85C";
const VERMELHO = "#D97757";
const TEXTO = "#F7F1EC";
const TEXTO_MUTED = "#9C8CA6";
const TEXTO_SUAVE = "#D8CEDD";
const BORDA = "#2E2233";

const FONT_STYLES = `
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');
  .ag-serif { font-family: 'Fraunces', serif; }
  .ag-mono { font-family: 'IBM Plex Mono', monospace; }
  .ticket { position: relative; }
  .ticket::before, .ticket::after {
    content: ""; position: absolute; top: 50%; width: 14px; height: 14px;
    background: ${FUNDO}; border-radius: 999px; transform: translateY(-50%);
  }
  .ticket::before { left: -7px; } .ticket::after { right: -7px; }
  .perf { background-image: radial-gradient(circle, ${FUNDO} 2.5px, transparent 2.6px); background-size: 12px 12px; background-position: center; }
  .expand { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.28s ease; }
  .expand.open { grid-template-rows: 1fr; }
  .expand > div { overflow: hidden; }
  .listrado { background-image: repeating-linear-gradient(135deg, ${PAINEL_CLARO} 0px, ${PAINEL_CLARO} 8px, ${PAINEL} 8px, ${PAINEL} 16px); }
  .campo-select {
    appearance: none; -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6' fill='none'><path d='M1 1L5 5L9 1' stroke='%239C8CA6' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat; background-position: right 12px center;
  }
  .campo::placeholder { color: #6E5E78; }
  * { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; }
`;

// ============================================================================
// Dados de exemplo
// ============================================================================

const SERVICOS_INICIAIS = [
  { id: "manicure", nome: "Manicure", icone: "Sparkles", preco: 45, duracao: "50 min", descricao: "Cutilagem, lixamento e esmaltação tradicional para deixar as mãos impecáveis." },
  { id: "pedicure", nome: "Pedicure", icone: "Droplet", preco: 50, duracao: "55 min", descricao: "Cuidado completo para os pés, com esfoliação, cutilagem e esmaltação." },
  { id: "alongamento", nome: "Alongamento em gel", icone: "Gem", preco: 140, duracao: "2h", descricao: "Construção de unhas em gel com molde, no comprimento e formato que você escolher." },
  { id: "banho-gel", nome: "Banho de gel", icone: "Wand2", preco: 70, duracao: "1h", descricao: "Camada de gel sobre a unha natural para fortalecer e dar acabamento duradouro." },
  { id: "manutencao", nome: "Manutenção", icone: "Brush", preco: 60, duracao: "1h 10min", descricao: "Ajuste do alongamento ou banho de gel existente, corrigindo o crescimento da unha." },
  { id: "esmaltacao-gel", nome: "Esmaltação em gel", icone: "Palette", preco: 55, duracao: "45 min", descricao: "Esmaltação em gel de longa duração, com brilho intenso por até três semanas." },
  { id: "spa-pes", nome: "Spa dos pés", icone: "Waves", preco: 90, duracao: "1h 20min", descricao: "Hidratação profunda, esfoliação e massagem relaxante para os pés." },
  { id: "remocao", nome: "Remoção", icone: "Eraser", preco: 25, duracao: "30 min", descricao: "Remoção segura de gel ou alongamento, sem danificar a unha natural." },
  { id: "decoracao", nome: "Decoração", icone: "Flower2", preco: 20, duracao: "20 min", descricao: "Nail art personalizada para complementar qualquer um dos serviços acima." },
];

const ICONES = { Sparkles, Droplet, Gem, Brush, Wand2, Palette, Waves, Eraser, Flower2 };

const CLIENTES_INICIAIS = [
  { id: 1, nome: "Marina Souza", telefone: "(11) 98221-4470", observacao: "Prefere fim de tarde" },
  { id: 2, nome: "Juliana Alves", telefone: "(11) 97744-2201", observacao: "" },
  { id: 3, nome: "Patrícia Lima", telefone: "(11) 96633-8890", observacao: "Alérgica a acetona comum" },
];

const AGENDAMENTOS_LEMBRETES = [
  { id: 1, cliente: "Marina Souza", servico: "Alongamento em gel", data: "hoje", hora: "16:00", status: "confirmado_2h" },
  { id: 2, cliente: "Juliana Alves", servico: "Manicure", data: "hoje", hora: "17:30", status: "aguardando_24h" },
  { id: 3, cliente: "Patrícia Lima", servico: "Spa dos pés", data: "amanhã", hora: "09:30", status: "sem_resposta" },
  { id: 4, cliente: "Camila Rocha", servico: "Esmaltação em gel", data: "amanhã", hora: "11:00", status: "confirmado_2h" },
  { id: 5, cliente: "Fernanda Dias", servico: "Pedicure", data: "amanhã", hora: "14:00", status: "sem_resposta" },
];

const STATUS_LEMBRETE = {
  aguardando_24h: { label: "Enviado 24h antes · aguardando resposta", cor: TEXTO_MUTED, icone: CalendarClock, bg: PAINEL_CLARO },
  confirmado_2h: { label: "Confirmado · lembrete de 2h agendado", cor: VERDE, icone: Check, bg: "rgba(143,184,168,0.12)" },
  sem_resposta: { label: "Sem resposta — decisão necessária", cor: AMBAR, icone: AlertTriangle, bg: "rgba(224,168,92,0.12)" },
  remarcado: { label: "Aguardando novo horário", cor: TEXTO_MUTED, icone: RotateCcw, bg: PAINEL_CLARO },
  liberado: { label: "Horário liberado", cor: TEXTO_MUTED, icone: XCircle, bg: PAINEL_CLARO },
};

const FORMAS_PAGAMENTO = [
  { id: "pix", nome: "Pix", icone: QrCode },
  { id: "cartao", nome: "Cartão", icone: CreditCard },
  { id: "dinheiro", nome: "Dinheiro", icone: Banknote },
];

const DIAS_SEMANA = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];

function gerarDias(base, quantidade) {
  const dias = [];
  for (let i = 0; i < quantidade; i++) {
    const d = new Date(base);
    d.setDate(base.getDate() + i);
    dias.push(d);
  }
  return dias;
}
function horariosDoDia(indice) {
  const base = ["09:00","09:30","10:00","10:30","11:00","13:00","13:30","14:00","14:30","15:00","15:30","16:30","17:00"];
  const ocupados = new Set([(indice * 3) % base.length, (indice * 5 + 2) % base.length, (indice + 7) % base.length]);
  return base.map((h, i) => ({ hora: h, livre: !ocupados.has(i) }));
}
function formatarDia(d) {
  return `${DIAS_SEMANA[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;
}

const ASSINATURA = { plano: "Plano Profissional", valor: 79, vencimento: "18 de agosto", diasAtraso: 4 };

// ============================================================================
// App
// ============================================================================

function App() {
  const [assinaturaAtiva, setAssinaturaAtiva] = useState(true);
  const [aba, setAba] = useState("agendar");
  const [servicos, setServicos] = useState(SERVICOS_INICIAIS);
  const [clientes, setClientes] = useState(CLIENTES_INICIAIS);

  const ABAS = [
    { id: "agendar", label: "Agendar", icone: Calendar },
    { id: "lembretes", label: "Lembretes", icone: Bell },
    { id: "clientes", label: "Clientes", icone: Users },
    { id: "servicos", label: "Serviços", icone: Scissors },
  ];

  return (
    <div className="min-h-screen w-full flex items-start justify-center p-0" style={{ background: FUNDO }}>
      <style>{FONT_STYLES}</style>
      <div className="w-full flex flex-col" style={{ background: PAINEL, minHeight: "100vh" }}>
        {!assinaturaAtiva ? (
          <TelaBloqueio onRegularizar={() => setAssinaturaAtiva(true)} />
        ) : (
          <>
            <div className="flex items-center justify-between px-5 pt-5 pb-2 shrink-0">
              <p className="ag-mono text-[10px] tracking-widest uppercase" style={{ color: TEXTO_MUTED }}>Estúdio de Unhas</p>
              <button onClick={() => setAssinaturaAtiva(false)} className="ag-mono text-[9px] tracking-widest uppercase px-2 py-1 rounded-full" style={{ background: PAINEL_CLARO, color: TEXTO_MUTED, border: "none" }} title="Simular assinatura em atraso">
                simular bloqueio
              </button>
            </div>
            <div className="flex-1 flex flex-col" style={{ minHeight: 0 }}>
              {aba === "agendar" && <FluxoAgendamento servicos={servicos} />}
              {aba === "lembretes" && <TelaLembretes />}
              {aba === "clientes" && <TelaClientes clientes={clientes} setClientes={setClientes} />}
              {aba === "servicos" && <TelaServicosAdmin servicos={servicos} setServicos={setServicos} />}
            </div>
            <div className="flex shrink-0" style={{ borderTop: "1px solid " + BORDA, background: PAINEL_CLARO, paddingBottom: "env(safe-area-inset-bottom)" }}>
              {ABAS.map((a) => {
                const Icone = a.icone;
                const ativo = aba === a.id;
                return (
                  <button key={a.id} onClick={() => setAba(a.id)} className="flex-1 flex flex-col items-center gap-1 py-2.5" style={{ background: "none", border: "none" }}>
                    <Icone size={17} color={ativo ? OURO : TEXTO_MUTED} />
                    <span className="text-[10px] font-medium" style={{ color: ativo ? OURO : TEXTO_MUTED }}>{a.label}</span>
                  </button>
                );
              })}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

// ============================================================================
// Aba: Agendar
// ============================================================================

function FluxoAgendamento({ servicos }) {
  const [etapa, setEtapa] = useState("servico");
  const [servicoId, setServicoId] = useState(null);
  const [abertoId, setAbertoId] = useState(null);
  const [observacao, setObservacao] = useState("");
  const [pagamento, setPagamento] = useState(null);

  const hoje = useMemo(() => new Date(), []);
  const dias = useMemo(() => gerarDias(hoje, 14), [hoje]);
  const [diaSelecionado, setDiaSelecionado] = useState(0);
  const [horaSelecionada, setHoraSelecionada] = useState("");

  const servico = servicos.find((s) => s.id === servicoId);
  const horarios = horariosDoDia(diaSelecionado);
  const dia = dias[diaSelecionado];
  const podeRevisar = servico && horaSelecionada;

  function tocarServico(id) {
    setAbertoId((atual) => (atual === id ? null : id));
    setServicoId(id);
  }
  function mudarDia(i) { setDiaSelecionado(i); setHoraSelecionada(""); }
  function recomecar() {
    setEtapa("servico"); setServicoId(null); setAbertoId(null);
    setHoraSelecionada(""); setDiaSelecionado(0); setObservacao(""); setPagamento(null);
  }

  const titulos = {
    servico: ["Passo 1 de 2", "Escolha o serviço"],
    revisao: ["Passo 2 de 2", "Revisão e pagamento"],
    sucesso: ["Tudo certo", "Agendamento realizado"],
  };
  const [eyebrow, titulo] = titulos[etapa];

  return (
    <>
      <div className="px-6 pt-2 pb-5 shrink-0">
        <div className="flex items-center gap-2 mb-1">
          {etapa === "revisao" && (
            <button onClick={() => setEtapa("servico")} className="p-1 -ml-1 rounded-full" style={{ color: TEXTO_MUTED, background: "none", border: "none" }} aria-label="Voltar">
              <ArrowLeft size={16} />
            </button>
          )}
          <p className="ag-mono text-[11px] tracking-[0.2em] uppercase" style={{ color: TEXTO_MUTED }}>{eyebrow}</p>
        </div>
        <h1 className="ag-serif text-[24px] leading-tight" style={{ color: TEXTO }}>{titulo}</h1>
      </div>

      {etapa === "servico" && (
        <>
          <div className="px-6 pb-4 flex-1 overflow-y-auto">
            <div className="flex flex-col gap-2.5">
              {servicos.map((s) => {
                const Icone = ICONES[s.icone] || SparklesIcon;
                const aberto = abertoId === s.id;
                const selecionado = servicoId === s.id;
                return (
                  <div key={s.id} className="rounded-2xl overflow-hidden" style={{ background: CARTAO, border: `1px solid ${selecionado ? OURO : BORDA}` }}>
                    <button onClick={() => tocarServico(s.id)} className="w-full flex items-center gap-3 px-4 py-4 text-left" style={{ background: "none", border: "none" }}>
                      <div className="w-10 h-10 shrink-0 rounded-full flex items-center justify-center" style={{ background: PAINEL_CLARO }}>
                        <Icone size={17} color={OURO} />
                      </div>
                      <span className="flex-1 text-[15px] font-medium" style={{ color: TEXTO }}>{s.nome}</span>
                      {selecionado && !aberto && <Check size={15} color={OURO} />}
                      <ChevronDown size={16} color={TEXTO_MUTED} style={{ transform: aberto ? "rotate(180deg)" : "none", transition: "transform 0.2s ease" }} />
                    </button>
                    <div className={`expand ${aberto ? "open" : ""}`}>
                      <div>
                        <div className="px-4 pb-4">
                          <div className="flex gap-2 mb-3">
                            <div className="flex-1 rounded-lg py-2 text-center" style={{ background: PAINEL_CLARO }}>
                              <p className="ag-mono text-[9px] uppercase tracking-widest mb-0.5" style={{ color: TEXTO_MUTED }}>Valor</p>
                              <p className="text-[14px] font-semibold" style={{ color: TEXTO }}>R${s.preco}</p>
                            </div>
                            <div className="flex-1 rounded-lg py-2 text-center" style={{ background: PAINEL_CLARO }}>
                              <p className="ag-mono text-[9px] uppercase tracking-widest mb-0.5" style={{ color: TEXTO_MUTED }}>Tempo</p>
                              <p className="text-[14px] font-semibold" style={{ color: TEXTO }}>{s.duracao}</p>
                            </div>
                          </div>
                          <p className="text-[12.5px] leading-relaxed" style={{ color: TEXTO_SUAVE }}>{s.descricao}</p>
                        </div>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="px-6 pt-4 pb-5 shrink-0" style={{ background: PAINEL_CLARO, borderTop: "1px solid " + BORDA }}>
            {servico && (
              <p className="text-[12.5px] mb-3" style={{ color: TEXTO_MUTED }}>
                Serviço: <span style={{ color: TEXTO }} className="font-medium">{servico.nome}</span>
                <span className="ag-mono"> · R${servico.preco} · {servico.duracao}</span>
              </p>
            )}
            <div className="flex gap-2 mb-4">
              <label className="flex-1">
                <span className="ag-mono text-[9px] uppercase tracking-widest flex items-center gap-1 mb-1" style={{ color: TEXTO_MUTED }}><Calendar size={10} /> Data</span>
                <select className="campo-select w-full rounded-lg py-2.5 pl-3 pr-8 text-[13px] font-medium" style={{ background: CARTAO, color: TEXTO, border: "1px solid #3A2C41" }} value={diaSelecionado} onChange={(e) => mudarDia(Number(e.target.value))}>
                  {dias.map((d, i) => <option key={i} value={i}>{formatarDia(d)}</option>)}
                </select>
              </label>
              <label className="w-[38%]">
                <span className="ag-mono text-[9px] uppercase tracking-widest flex items-center gap-1 mb-1" style={{ color: TEXTO_MUTED }}><Clock size={10} /> Horário</span>
                <select className="campo-select w-full rounded-lg py-2.5 pl-3 pr-7 text-[13px] font-medium disabled:opacity-40" style={{ background: CARTAO, color: TEXTO, border: "1px solid #3A2C41" }} value={horaSelecionada} onChange={(e) => setHoraSelecionada(e.target.value)} disabled={!servico}>
                  <option value="" disabled>—</option>
                  {horarios.filter((h) => h.livre).map((h) => <option key={h.hora} value={h.hora}>{h.hora}</option>)}
                </select>
              </label>
            </div>
            <button onClick={() => setEtapa("revisao")} disabled={!podeRevisar} className="w-full rounded-xl py-3 font-medium text-[14px] disabled:opacity-30" style={{ background: OURO, color: PAINEL, border: "none" }}>
              Revisar agendamento
            </button>
          </div>
        </>
      )}

      {etapa === "revisao" && servico && (
        <div className="px-6 pb-6 flex-1 overflow-y-auto">
          <div className="rounded-2xl p-5 mb-5" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
            <div className="flex items-center gap-3 mb-4">
              <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style={{ background: PAINEL_CLARO }}>
                {React.createElement(ICONES[servico.icone] || SparklesIcon, { size: 16, color: OURO })}
              </div>
              <p className="text-[15px] font-medium" style={{ color: TEXTO }}>{servico.nome}</p>
            </div>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Data</span><span className="font-medium" style={{ color: TEXTO }}>{formatarDia(dia)}</span></div>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Horário</span><span className="font-medium ag-mono" style={{ color: TEXTO }}>{horaSelecionada}</span></div>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Duração</span><span className="font-medium" style={{ color: TEXTO }}>{servico.duracao}</span></div>
            <div className="flex justify-between text-[14px] pt-3 mt-2" style={{ color: TEXTO, borderTop: "1px dashed #3A2C41" }}><span className="font-medium">Valor total</span><span className="font-semibold">R${servico.preco}</span></div>
          </div>

          <label className="block mb-5">
            <span className="ag-mono text-[11px] tracking-widest uppercase mb-2 flex items-center gap-1.5" style={{ color: TEXTO_MUTED }}><MessageSquare size={12} /> Observações (opcional)</span>
            <textarea value={observacao} onChange={(e) => setObservacao(e.target.value)} placeholder="Preferência de horário, algum detalhe do serviço..." rows={2} className="campo w-full rounded-xl p-3.5 text-[13.5px] resize-none" style={{ background: CARTAO, color: TEXTO, border: "1px solid #3A2C41" }} />
          </label>

          <div className="mb-6">
            <span className="ag-mono text-[11px] tracking-widest uppercase mb-2 block" style={{ color: TEXTO_MUTED }}>Forma de pagamento</span>
            <div className="grid grid-cols-3 gap-2">
              {FORMAS_PAGAMENTO.map((f) => {
                const Icone = f.icone; const ativo = pagamento === f.id;
                return (
                  <button key={f.id} onClick={() => setPagamento(f.id)} className="rounded-xl py-3 flex flex-col items-center gap-1.5" style={{ background: ativo ? OURO : CARTAO, border: `1px solid ${ativo ? OURO : "#3A2C41"}` }}>
                    <Icone size={17} color={ativo ? PAINEL : TEXTO_SUAVE} />
                    <span className="text-[12px] font-medium" style={{ color: ativo ? PAINEL : TEXTO_SUAVE }}>{f.nome}</span>
                  </button>
                );
              })}
            </div>
          </div>

          <div className="flex flex-col gap-2.5">
            <button onClick={() => setEtapa("sucesso")} disabled={!pagamento} className="w-full rounded-xl py-3.5 font-medium text-[15px] disabled:opacity-30" style={{ background: OURO, color: PAINEL, border: "none" }}>
              Confirmar agendamento
            </button>
            <button onClick={() => setEtapa("servico")} className="w-full rounded-xl py-3 font-medium text-[13.5px] flex items-center justify-center gap-1.5" style={{ background: "transparent", color: TEXTO_MUTED, border: "1px solid #3A2C41" }}>
              <ArrowLeft size={14} /> Voltar e editar
            </button>
          </div>
        </div>
      )}

      {etapa === "sucesso" && servico && (
        <div className="px-6 pb-8 pt-2 flex-1 overflow-y-auto flex flex-col items-center text-center">
          <div className="w-14 h-14 rounded-full flex items-center justify-center mb-4" style={{ background: OURO }}><Check size={26} color={PAINEL} /></div>
          <p className="text-[15px] font-medium mb-1" style={{ color: TEXTO }}>Agendamento realizado com sucesso!</p>
          <p className="text-[13px] mb-4" style={{ color: TEXTO_SUAVE }}>Você receberá uma confirmação e um lembrete.</p>
          <div className="flex items-center gap-2 rounded-full px-4 py-2 mb-6" style={{ background: PAINEL_CLARO }}>
            <ShieldCheck size={13} color={OURO} /><span className="text-[12px]" style={{ color: TEXTO_SUAVE }}>Pagamento e horário garantidos</span>
          </div>
          <div className="ticket perf w-full rounded-2xl p-5 text-left" style={{ background: CARTAO, border: "1px dashed #3A2C41" }}>
            <p className="ag-mono text-[10px] tracking-widest uppercase mb-3" style={{ color: TEXTO_MUTED }}>Comprovante</p>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Serviço</span><span className="font-medium">{servico.nome}</span></div>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Data</span><span className="font-medium">{formatarDia(dia)}</span></div>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Horário</span><span className="font-medium ag-mono">{horaSelecionada}</span></div>
            <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Pagamento</span><span className="font-medium">{FORMAS_PAGAMENTO.find((f) => f.id === pagamento)?.nome}</span></div>
            <div className="flex justify-between text-[13px] pt-2 mt-1" style={{ color: TEXTO, borderTop: "1px dashed #3A2C41" }}><span>Valor</span><span className="font-semibold">R${servico.preco}</span></div>
          </div>
          <button onClick={recomecar} className="mt-6 text-[13px] ag-mono underline" style={{ color: TEXTO_MUTED, background: "none", border: "none" }}>Fazer outro agendamento</button>
        </div>
      )}
    </>
  );
}

// ============================================================================
// Aba: Lembretes
// ============================================================================

function TelaLembretes() {
  const [agendamentos, setAgendamentos] = useState(AGENDAMENTOS_LEMBRETES);
  const pendentes = agendamentos.filter((a) => a.status === "sem_resposta").length;
  function atualizar(id, status) { setAgendamentos((atual) => atual.map((a) => (a.id === id ? { ...a, status } : a))); }
  const grupos = [
    { titulo: "hoje", itens: agendamentos.filter((a) => a.data === "hoje") },
    { titulo: "amanhã", itens: agendamentos.filter((a) => a.data === "amanhã") },
  ];
  return (
    <div className="flex-1 overflow-y-auto px-6 pt-2 pb-6">
      <h1 className="ag-serif text-[24px] leading-tight mb-1" style={{ color: TEXTO }}>Próximos horários</h1>
      <p className="text-[12px] leading-relaxed mb-2" style={{ color: TEXTO_MUTED }}>
        24h antes a cliente recebe <span style={{ color: TEXTO_SUAVE }}>Confirmar</span> ou <span style={{ color: TEXTO_SUAVE }}>Remarcar</span>; quem confirma recebe só mais um lembrete 2h antes.
      </p>
      {pendentes > 0 && (
        <div className="flex items-center gap-1.5 mb-4"><AlertTriangle size={13} color={AMBAR} /><span className="text-[12.5px]" style={{ color: AMBAR }}>{pendentes} sem resposta — decisão necessária</span></div>
      )}
      {grupos.map((g) => g.itens.length > 0 && (
        <div key={g.titulo} className="mb-5">
          <p className="ag-mono text-[10px] tracking-widest uppercase mb-2.5" style={{ color: TEXTO_MUTED }}>{g.titulo}</p>
          <div className="flex flex-col gap-2.5">
            {g.itens.map((a) => {
              const info = STATUS_LEMBRETE[a.status]; const Icone = info.icone; const precisa = a.status === "sem_resposta";
              return (
                <div key={a.id} className="rounded-2xl p-4" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
                  <div className="flex items-start justify-between mb-2">
                    <div><p className="text-[14px] font-medium" style={{ color: TEXTO }}>{a.cliente}</p><p className="text-[12px]" style={{ color: TEXTO_MUTED }}>{a.servico}</p></div>
                    <div className="flex items-center gap-1 ag-mono text-[12px] shrink-0 ml-2" style={{ color: TEXTO_SUAVE }}><Clock size={11} /> {a.hora}</div>
                  </div>
                  <div className="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 mt-1" style={{ background: info.bg }}>
                    <Icone size={11} color={info.cor} /><span className="text-[11px] font-medium" style={{ color: info.cor }}>{info.label}</span>
                  </div>
                  {precisa && (
                    <div className="flex gap-2 mt-3">
                      <button onClick={() => atualizar(a.id, "remarcado")} className="flex-1 rounded-lg py-2 flex items-center justify-center gap-1.5 text-[12.5px] font-medium" style={{ background: OURO, color: PAINEL, border: "none" }}><Calendar size={12} /> Remarcar</button>
                      <button onClick={() => atualizar(a.id, "liberado")} className="flex-1 rounded-lg py-2 flex items-center justify-center gap-1.5 text-[12.5px] font-medium" style={{ background: "transparent", color: TEXTO_SUAVE, border: "1px solid #3A2C41" }}><XCircle size={12} /> Liberar horário</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>
      ))}
    </div>
  );
}

// ============================================================================
// Aba: Clientes
// ============================================================================

function TelaClientes({ clientes, setClientes }) {
  const [nome, setNome] = useState("");
  const [telefone, setTelefone] = useState("");
  const [mostrarForm, setMostrarForm] = useState(false);

  function adicionar() {
    if (!nome.trim()) return;
    setClientes((atual) => [...atual, { id: Date.now(), nome: nome.trim(), telefone: telefone.trim(), observacao: "" }]);
    setNome(""); setTelefone(""); setMostrarForm(false);
  }
  function remover(id) { setClientes((atual) => atual.filter((c) => c.id !== id)); }

  return (
    <div className="flex-1 overflow-y-auto px-6 pt-2 pb-6">
      <div className="flex items-center justify-between mb-4">
        <h1 className="ag-serif text-[24px] leading-tight" style={{ color: TEXTO }}>Clientes</h1>
        <button onClick={() => setMostrarForm((v) => !v)} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: OURO, border: "none" }}>
          <Plus size={17} color={PAINEL} />
        </button>
      </div>

      {mostrarForm && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
          <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome da cliente" className="campo w-full rounded-lg py-2.5 px-3 text-[13.5px] mb-2" style={{ background: PAINEL_CLARO, color: TEXTO, border: "1px solid #3A2C41" }} />
          <input value={telefone} onChange={(e) => setTelefone(e.target.value)} placeholder="Telefone" className="campo w-full rounded-lg py-2.5 px-3 text-[13.5px] mb-3" style={{ background: PAINEL_CLARO, color: TEXTO, border: "1px solid #3A2C41" }} />
          <button onClick={adicionar} className="w-full rounded-lg py-2.5 text-[13px] font-medium" style={{ background: OURO, color: PAINEL, border: "none" }}>Salvar cliente</button>
        </div>
      )}

      <div className="flex flex-col gap-2.5">
        {clientes.map((c) => (
          <div key={c.id} className="rounded-2xl p-4 flex items-center gap-3" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
            <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0 ag-serif text-[15px]" style={{ background: PAINEL_CLARO, color: OURO }}>
              {c.nome.charAt(0).toUpperCase()}
            </div>
            <div className="flex-1 min-w-0">
              <p className="text-[14px] font-medium truncate" style={{ color: TEXTO }}>{c.nome}</p>
              {c.telefone && <p className="text-[12px] flex items-center gap-1" style={{ color: TEXTO_MUTED }}><Phone size={10} /> {c.telefone}</p>}
              {c.observacao && <p className="text-[11.5px] mt-0.5" style={{ color: TEXTO_SUAVE }}>{c.observacao}</p>}
            </div>
            <button onClick={() => remover(c.id)} className="p-1.5" style={{ background: "none", border: "none" }} aria-label="Remover"><Trash2 size={14} color={TEXTO_MUTED} /></button>
          </div>
        ))}
        {clientes.length === 0 && <p className="text-[13px] text-center py-8" style={{ color: TEXTO_MUTED }}>Nenhuma cliente cadastrada ainda.</p>}
      </div>
    </div>
  );
}

// ============================================================================
// Aba: Serviços
// ============================================================================

function TelaServicosAdmin({ servicos, setServicos }) {
  const [nome, setNome] = useState("");
  const [preco, setPreco] = useState("");
  const [duracao, setDuracao] = useState("");
  const [mostrarForm, setMostrarForm] = useState(false);

  function adicionar() {
    if (!nome.trim() || !preco) return;
    setServicos((atual) => [...atual, {
      id: "s" + Date.now(), nome: nome.trim(), preco: Number(preco), duracao: duracao.trim() || "—",
      descricao: "Novo serviço — edite a descrição depois.", icone: "Sparkles",
    }]);
    setNome(""); setPreco(""); setDuracao(""); setMostrarForm(false);
  }
  function remover(id) { setServicos((atual) => atual.filter((s) => s.id !== id)); }

  return (
    <div className="flex-1 overflow-y-auto px-6 pt-2 pb-6">
      <div className="flex items-center justify-between mb-4">
        <h1 className="ag-serif text-[24px] leading-tight" style={{ color: TEXTO }}>Serviços</h1>
        <button onClick={() => setMostrarForm((v) => !v)} className="w-9 h-9 rounded-full flex items-center justify-center" style={{ background: OURO, border: "none" }}>
          <Plus size={17} color={PAINEL} />
        </button>
      </div>

      {mostrarForm && (
        <div className="rounded-2xl p-4 mb-4" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
          <input value={nome} onChange={(e) => setNome(e.target.value)} placeholder="Nome do serviço" className="campo w-full rounded-lg py-2.5 px-3 text-[13.5px] mb-2" style={{ background: PAINEL_CLARO, color: TEXTO, border: "1px solid #3A2C41" }} />
          <div className="flex gap-2 mb-3">
            <input value={preco} onChange={(e) => setPreco(e.target.value)} placeholder="Preço (R$)" type="number" className="campo flex-1 rounded-lg py-2.5 px-3 text-[13.5px]" style={{ background: PAINEL_CLARO, color: TEXTO, border: "1px solid #3A2C41" }} />
            <input value={duracao} onChange={(e) => setDuracao(e.target.value)} placeholder="Duração" className="campo flex-1 rounded-lg py-2.5 px-3 text-[13.5px]" style={{ background: PAINEL_CLARO, color: TEXTO, border: "1px solid #3A2C41" }} />
          </div>
          <button onClick={adicionar} className="w-full rounded-lg py-2.5 text-[13px] font-medium" style={{ background: OURO, color: PAINEL, border: "none" }}>Salvar serviço</button>
        </div>
      )}

      <div className="flex flex-col gap-2.5">
        {servicos.map((s) => {
          const Icone = ICONES[s.icone] || SparklesIcon;
          return (
            <div key={s.id} className="rounded-2xl p-4 flex items-center gap-3" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
              <div className="w-10 h-10 rounded-full flex items-center justify-center shrink-0" style={{ background: PAINEL_CLARO }}>
                <Icone size={17} color={OURO} />
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-[14px] font-medium truncate" style={{ color: TEXTO }}>{s.nome}</p>
                <p className="ag-mono text-[11.5px]" style={{ color: TEXTO_MUTED }}>R${s.preco} · {s.duracao}</p>
              </div>
              <button onClick={() => remover(s.id)} className="p-1.5" style={{ background: "none", border: "none" }} aria-label="Remover"><Trash2 size={14} color={TEXTO_MUTED} /></button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ============================================================================
// Bloqueio por assinatura
// ============================================================================

function TelaBloqueio({ onRegularizar }) {
  const [pagamento, setPagamento] = useState(null);
  const [processando, setProcessando] = useState(false);

  function regularizar() {
    if (!pagamento) return;
    setProcessando(true);
    setTimeout(() => { setProcessando(false); onRegularizar(); }, 1000);
  }

  return (
    <div className="flex-1 flex flex-col overflow-y-auto">
      <div className="listrado h-2 shrink-0" />
      <div className="px-6 pt-8 pb-5 shrink-0 flex flex-col items-center text-center" style={{ background: `linear-gradient(180deg,${PAINEL_CLARO} 0%,${PAINEL} 100%)` }}>
        <div className="w-14 h-14 rounded-full flex items-center justify-center mb-4" style={{ background: "rgba(217,119,87,0.14)" }}><Lock size={22} color={VERMELHO} /></div>
        <p className="ag-mono text-[11px] tracking-[0.2em] uppercase mb-1" style={{ color: VERMELHO }}>Acesso bloqueado</p>
        <h1 className="ag-serif text-[22px] leading-tight" style={{ color: TEXTO }}>Assinatura pendente</h1>
        <p className="text-[13px] mt-2 max-w-[260px]" style={{ color: TEXTO_MUTED }}>Sua agenda, lembretes e agendamentos ficam pausados até o pagamento ser regularizado.</p>
      </div>
      <div className="px-6 pb-6 flex-1">
        <div className="rounded-2xl p-5 mb-5" style={{ background: CARTAO, border: "1px solid " + BORDA }}>
          <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Plano</span><span className="font-medium" style={{ color: TEXTO }}>{ASSINATURA.plano}</span></div>
          <div className="flex justify-between text-[13px] mb-2" style={{ color: TEXTO_SUAVE }}><span>Vencimento</span><span className="font-medium" style={{ color: TEXTO }}>{ASSINATURA.vencimento}</span></div>
          <div className="flex justify-between text-[13px] mb-3" style={{ color: TEXTO_SUAVE }}><span>Em atraso há</span><span className="font-medium" style={{ color: VERMELHO }}>{ASSINATURA.diasAtraso} dias</span></div>
          <div className="flex justify-between text-[15px] pt-3" style={{ color: TEXTO, borderTop: "1px dashed #3A2C41" }}><span className="font-medium">Valor a regularizar</span><span className="font-semibold">R${ASSINATURA.valor}/mês</span></div>
        </div>
        <div className="mb-6">
          <span className="ag-mono text-[11px] tracking-widest uppercase mb-2 block" style={{ color: TEXTO_MUTED }}>Forma de pagamento</span>
          <div className="grid grid-cols-2 gap-2">
            {FORMAS_PAGAMENTO.slice(0, 2).map((f) => {
              const Icone = f.icone; const ativo = pagamento === f.id;
              return (
                <button key={f.id} onClick={() => setPagamento(f.id)} className="rounded-xl py-3 flex flex-col items-center gap-1.5" style={{ background: ativo ? OURO : CARTAO, border: `1px solid ${ativo ? OURO : "#3A2C41"}` }}>
                  <Icone size={17} color={ativo ? PAINEL : TEXTO_SUAVE} /><span className="text-[12px] font-medium" style={{ color: ativo ? PAINEL : TEXTO_SUAVE }}>{f.nome}</span>
                </button>
              );
            })}
          </div>
        </div>
        <button onClick={regularizar} disabled={!pagamento || processando} className="w-full rounded-xl py-3.5 font-medium text-[15px] disabled:opacity-30 flex items-center justify-center gap-2" style={{ background: OURO, color: PAINEL, border: "none" }}>
          {processando ? <><RefreshCw size={15} className="animate-spin" /> Processando...</> : "Regularizar pagamento"}
        </button>
        <p className="text-[11.5px] text-center mt-4 leading-relaxed" style={{ color: TEXTO_MUTED }}>O acesso é liberado automaticamente assim que o pagamento é confirmado.</p>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch((e) => console.warn("Falha ao registrar o service worker:", e));
  });
}
</script>
</body>
</html>
